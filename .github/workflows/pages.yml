name: Publish site

# Publică site-ul (landing + aplicație) pe GitHub Pages la fiecare push pe main.
# Se publică doar fișierele site-ului, nu și cele interne (CLAUDE.md, firebase/, README...).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html og.png .nojekyll app _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
