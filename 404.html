<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Foliet Sketchbook</title>
<meta name="description" content="A notebook shared from Foliet Sketchbook – a digital sketchbook that opens in your browser.">
<script>
// the same light / dark choice as the app and the landing page
(function(){try{var t=(JSON.parse(localStorage.getItem('sb-set')||'{}').theme)||'auto';if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}})();
</script>
<style>
:root{color-scheme:light dark;--bg:#e4e9e6;--ink:#1c2428;--line:#c9d0cc;--accent:#23407a;--muted:#5d6a70}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161d20;--ink:#e8eeec;--line:#35424a;--accent:#8fb0f0;--muted:#9fb0b6}}
:root[data-theme="dark"]{--bg:#161d20;--ink:#e8eeec;--line:#35424a;--accent:#8fb0f0;--muted:#9fb0b6}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
a{color:inherit}
.btn{display:inline-flex;align-items:center;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;padding:10px 18px;text-decoration:none}
/* while a live link opens Foliet: a spinner for a moment */
#ldv{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.msg{max-width:440px;margin:18vh auto 0;padding:0 20px;text-align:center}.msg h1{font-size:1.6em;line-height:1.2;margin:0 0 10px}.msg p{color:var(--muted)}.msg .btn{margin-top:10px}
footer{text-align:center;padding:30px 16px 40px;color:var(--muted);font-size:.9em}footer a{font-weight:700}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div id="ldv" role="status" aria-live="polite"><div class="spin" aria-hidden="true"></div><b>Opening the notebook…</b></div>
<main id="main"></main>
<footer id="ft" hidden>Made with <a id="home" href="./">Foliet Sketchbook</a> – a sketchbook in your browser.</footer>
<script>
/* A live link to a notebook: <site>/<slug>/<code> (GitHub Pages and Netlify show this page for addresses that aren't files).
   It opens Foliet itself in view mode (app/?view=<code>): the same 3D book as in the app, anyone can look, no account.
   Any other address that isn't a file: "Page not found". */
(function(){
  var $=function(s){return document.querySelector(s)};
  // the site lives at / (Netlify, foliet.app) or at /Sketchbook/ (GitHub Pages); after it: <notebook-name>/<code>
  var root=location.pathname.indexOf('/Sketchbook/')===0?'/Sketchbook/':'/';
  var m=location.pathname.slice(root.length).match(/^([^\/]+)\/([a-z0-9]{6,10})\/?$/);
  $('#home').href=root;
  if(!m){
    $('#ldv').remove();$('#ft').hidden=false;
    $('#main').innerHTML='<div class="msg"><h1>Page not found</h1><p>This page doesn’t exist. Maybe the link is missing a part?</p><a class="btn">Go to Foliet</a></div>';
    $('.msg .btn').href=root;return;
  }
  var q=new URLSearchParams(location.search).get('emu');
  location.replace(root+'app/?view='+m[2]+(q?'&emu='+encodeURIComponent(q):''));
})();
</script>
</body>
</html>
