# Netlify: the site is a plain folder, no build step.
# Landing at /, the app at /app/.
[build]
  publish = "."

# Always check for a new app version (the service worker decides what to cache).
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Internal files that don't need to be public
[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/firebase/*"
  to = "/"
  status = 404
  force = true

# Live links: foliet.app/<notebook-name>/<code> shows the shared notebook (404.html is the viewer).
# Real files (like /app/sw.js) are served as they are; only addresses that aren't files come here.
[[redirects]]
  from = "/:slug/:code"
  to = "/404.html"
  status = 200
